[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="processtwin-ai-tcad"
version="1.0.0"
description="Physics-grounded AI surrogates for silicon thermal oxidation and dopant diffusion"
requires-python=">=3.10"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
